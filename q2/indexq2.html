<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic List</title>
  <link rel="stylesheet" href="styleq2.css" />
</head>
<body>

  <h2>MST List</h2>

  <label for="item-input">New Item</label>
  <input type="text" id="item-input" placeholder="Add anything to the list" onkeydown="if(event.key==='Enter') addItem()" />

  <div class="btn-group">
    <button id="btn-add" onclick="addItem()">Add New Item</button>
    <button id="btn-remove" onclick="removeLastItem()">Remove Last Item</button>
  </div>

  <ul id="item-list">
    <li id="empty-note">No items added</li>
  </ul>

  <script src="scriptq2.js"></script>
</body>
</html>
