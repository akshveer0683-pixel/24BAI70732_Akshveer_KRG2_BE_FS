<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <div class="container">
        <h2>Register Yourself</h2>
        <form>
            <label>Full Name:</label>
            <input type="text" required>
            <label>Your Email</label>
            <input type="email" required>
            <label>Password</label>
            <input type="password" required>
            <label>Confirm Password</label>
            <input type="password" required>
            <label>Enter Mob. No.</label>
            <input type="tel" required>
            <label>Gender</label>
            <input type="radio", class="inline", name="gender"> Male
            <input type="radio", class="inline", name="gender"> Female
            <input type="radio", class="inline", name="gender"> Others
            <label>Courses</label>
            <select>
                <option>B.E.</option>
                <option>B.B.A.</option>
                <option>B.Com.</option>
                <option>M.E.</option>
                <option>M.B.A.</option>
            </select>
            <label>Skills Pocessed</label>
            <input type="checkbox", class="inline"> C++
            <input type="checkbox", class="inline"> Java
            <input type="checkbox", class="inline"> Python
            <input type="checkbox", class="inline"> JavaScript
            <label>Address</label>
            <textarea rows="3"></textarea>
            <div class="buttons">
                <button type="submit">Submit</button>
            </div>
        </form>
        <\div>
    </body>
</html>
