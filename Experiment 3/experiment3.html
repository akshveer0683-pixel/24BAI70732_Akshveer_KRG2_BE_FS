<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search Form</title>
    <link rel="stylesheet" href="exp3.css">

</head>
<body>
    <div class="container">
        <h2>Job Search Form</h2>
        <form id="jobForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="jobTitle">Desired Job Title</label>
                <input type="text" id="jobTitle" name="jobTitle" required>
            </div>
            <div class="form-group">
                <label for="location">Preferred Location</label>
                <input type="text" id="location" name="location">
            </div>
            <div class="form-group">
                <label for="salary">Expected Salary</label>
                <input type="number" id="salary" name="salary" min="0">
            </div>
            <div class="form-group">
                <label for="experience">Years of Experience</label>
                <input type="number" id="experience" name="experience" min="0">
            </div>
            <div class="form-group">
                <label for="skills">Skills / Qualifications</label>
                <textarea id="skills" name="skills" rows="4"></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>

        <div class="profile" id="userProfile" style="display: none;">
            <h3>User Profile</h3>
            <div class="profile-item"><strong>Name:</strong> <span id="profileName"></span></div>
            <div class="profile-item"><strong>Email:</strong> <span id="profileEmail"></span></div>
            <div class="profile-item"><strong>Phone:</strong> <span id="profilePhone"></span></div>
            <div class="profile-item"><strong>Job Title:</strong> <span id="profileJobTitle"></span></div>
            <div class="profile-item"><strong>Location:</strong> <span id="profileLocation"></span></div>
            <div class="profile-item"><strong>Expected Salary:</strong> <span id="profileSalary"></span></div>
            <div class="profile-item"><strong>Experience:</strong> <span id="profileExperience"></span></div>
            <div class="profile-item"><strong>Skills:</strong> <span id="profileSkills"></span></div>
        </div>
    </div>

    <script src="exp3.js"></script>
</body>
</html>
